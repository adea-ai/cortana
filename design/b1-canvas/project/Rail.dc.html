<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cortana rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Primary navigation" style="--foreground: oklch(0.942 0.0054 297.72); --card: oklch(0.2106 0.0076 300.91); --muted-foreground: oklch(0.6967 0.0057 298.74); --border: oklch(0.3256 0.0057 300.91); --primary: oklch(0.7323 0.1668 301.69); width: {{width}}px; height: {{height}}px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--border); color: var(--foreground); font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 1.55;">
  <!-- ShellRail header: the app mark (app-icon.svg, 36px). -->
  <div data-slot="shell-rail-header" aria-hidden="true" style="display: flex; justify-content: center; padding: 4px 0 0;">
    <span data-slot="shell-rail-mark" style="height: 36px; display: flex; align-items: center; justify-content: center;">
      <svg width="36" height="36" viewBox="0 0 1024 1024" aria-hidden="true"><defs><filter id="cxglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs><rect width="1024" height="1024" rx="220" fill="#111013"></rect><circle cx="512" cy="512" r="290" fill="none" stroke="#353437" stroke-width="64"></circle><path d="M760 334c-55-78-146-126-248-126-168 0-304 136-304 304s136 304 304 304c102 0 193-50 248-127" fill="none" stroke="#bc8cff" stroke-linecap="round" stroke-width="70" filter="url(#cxglow)"></path><path d="M696 402c-35-48-91-78-154-78-105 0-190 85-190 190s85 190 190 190c63 0 119-31 154-79" fill="none" stroke="#ecebef" stroke-linecap="round" stroke-width="24" opacity="0.6"></path><g fill="#ecebef" filter="url(#cxglow)"><circle cx="760" cy="334" r="28"></circle><circle cx="208" cy="512" r="24"></circle><circle cx="760" cy="689" r="28"></circle><circle cx="542" cy="324" r="20"></circle><circle cx="352" cy="514" r="18"></circle><circle cx="542" cy="704" r="20"></circle></g></svg>
    </span>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; padding: 2px 8px 8px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <!-- Search entry (ShellRail onSearch): the search icon with the chord drawn as key caps beneath it, then a separator. -->
      <div data-slot="shell-rail-search" style="display: flex; flex-direction: column; gap: 2px;">
        <a href="KnowledgeAnswer.dc.html" aria-label="Search knowledge" aria-keyshortcuts="Meta+K Control+K" title="Search knowledge" style="height: 36px; width: 39px; box-sizing: border-box; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); text-decoration: none; font-weight: 500;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
        </a>
        <div data-slot="shell-rail-search-keys" aria-hidden="true" style="display: flex; justify-content: center; gap: 2px; padding-bottom: 4px;">
          <kbd style="height: 16px; min-width: 16px; box-sizing: border-box; padding: 0 3px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; line-height: 14px; display: inline-flex; align-items: center; justify-content: center;">⌘</kbd>
          <kbd style="height: 16px; min-width: 16px; box-sizing: border-box; padding: 0 3px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; line-height: 14px; display: inline-flex; align-items: center; justify-content: center;">K</kbd>
        </div>
      </div>
      <div aria-hidden="true" style="height: 1px; margin: 4px 0; background: var(--border);"></div>
      <sc-for list="{{top}}" as="item" hint-placeholder-count="4">
        <a href="{{item.href}}" aria-label="{{item.label}}" aria-current="{{item.current}}" title="{{item.label}}" style="height: 36px; width: {{itemWidth}}; box-sizing: border-box; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: {{justify}}; gap: 10px; padding: {{itemPad}}; background: {{item.bg}}; color: {{item.fg}}; text-decoration: none; font-weight: 500;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{item.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;">
            <sc-if value="{{item.isKnowledge}}" hint-placeholder-val="{{ false }}"><path d="M12 5v16"></path><path d="M16 13h2"></path><path d="M16 9h2"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path><path d="M6 13h2"></path><path d="M6 9h2"></path></sc-if>
            <sc-if value="{{item.isGraph}}" hint-placeholder-val="{{ false }}"><circle cx="12" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="6" r="3"></circle><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"></path><path d="M12 12v3"></path></sc-if>
            <sc-if value="{{item.isConversations}}" hint-placeholder-val="{{ false }}"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></sc-if>
            <sc-if value="{{item.isTools}}" hint-placeholder-val="{{ false }}"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></sc-if>
          </svg>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px; border-top: 1px solid var(--border);">
    <sc-for list="{{bottom}}" as="item" hint-placeholder-count="2">
      <a href="{{item.href}}" aria-label="{{item.label}}" aria-current="{{item.current}}" title="{{item.label}}" style="height: 36px; width: {{itemWidth}}; box-sizing: border-box; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: {{justify}}; gap: 10px; padding: {{itemPad}}; background: {{item.bg}}; color: {{item.fg}}; text-decoration: none; font-weight: 500;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{item.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;">
          <sc-if value="{{item.isInbox}}" hint-placeholder-val="{{ false }}"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></sc-if>
          <sc-if value="{{item.isUser}}" hint-placeholder-val="{{ false }}"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></sc-if>
        </svg>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["knowledge","graph","conversations","agent-tools","inbox","user","none"],"default":"knowledge"},"height":{"editor":null,"default":852},"$preview":{"width":56,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    // active "none" is also what Index and Settings look like: the app marks the
    // User settings trigger data-active there, but nothing styles it.
    // active "user" draws the trigger hovered while its menu is open
    // (hover:bg-primary-subtle/60 hover:text-primary); the menu itself adds no state.
    const active = this.props.active ?? 'knowledge';
    const fg = 'oklch(0.942 0.0054 297.72)';
    const muted = 'oklch(0.6967 0.0057 298.74)';
    const primary = 'oklch(0.7323 0.1668 301.69)';
    const mk = (id, label, href) => {
      const on = id === active;
      const hovered = on && id === 'user';
      return {
        id, label, href,
        current: on && !hovered ? 'page' : 'false',
        bg: hovered ? 'oklch(0.7323 0.1668 301.69 / 0.096)' : (on ? 'oklch(0.7323 0.1668 301.69 / 0.16)' : 'transparent'),
        fg: hovered ? primary : (on ? fg : muted),
        iconColor: on ? primary : muted,
        isKnowledge: id === 'knowledge', isGraph: id === 'graph', isConversations: id === 'conversations',
        isTools: id === 'agent-tools', isInbox: id === 'inbox', isUser: id === 'user'
      };
    };
    return {
      width: 56,
      height: Number(this.props.height ?? 852),
      itemWidth: '39px',
      itemPad: '0',
      justify: 'center',
      top: [
        mk('knowledge', 'Knowledge', 'KnowledgeAnswer.dc.html'),
        mk('graph', 'Graph', 'Graph.dc.html'),
        mk('conversations', 'Conversations', 'Conversations.dc.html'),
        mk('agent-tools', 'Agent tools', 'AgentTools.dc.html')
      ],
      bottom: [
        mk('inbox', 'Inbox', 'Inbox.dc.html'),
        mk('user', 'User settings', 'UserMenu.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
