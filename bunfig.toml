[test]
# Registers the Solid JSX transform first so .tsx test files compile through
# babel-preset-solid, then the happy-dom browser globals so Solid component
# tests (apps/web) can use solid-testing-library. Pure unit tests are
# unaffected by the presence of the mocked browser globals.
preload = ["./apps/web/src/test/solid-transform.ts", "./apps/web/src/test/harness.ts"]
