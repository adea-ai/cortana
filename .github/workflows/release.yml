name: Code Foundry Release

on:
  push:
    branches: [main]
  schedule:
    # Batch Release Please to four windows per day. Every push to main used to
    # update the version pull request immediately, and the configured
    # automation token merged it on sight, so each merge became its own
    # release (6-8/day) with a full release-assets build behind it. Scheduled
    # runs let the version pull request accumulate one window's changes; a
    # run with nothing unreleased is a cheap no-op.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      release-while-paused:
        description: Run only the release pipeline while the shared CI billing pause remains active.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One owner for draft staging and npm publication. Never cancel an active release.
concurrency:
  group: code-foundry-qualified-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Version pull requests keep flowing even when the candidate is broken;
    # publication stays gated on qualification success in the stage job.
    #
    # Batching gate: ordinary main pushes no longer run Release Please (the
    # schedule above owns version pull requests between windows), but the
    # squash merge of a version pull request must still trigger this workflow
    # so Release Please cuts the tag and the publication pipeline runs.
    if: >-
      (vars.CI_BILLING_PAUSED != 'true' || (github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true)) &&
      (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(main): release '))
    uses: 0xPlayerOne/code-foundry/.github/workflows/release.yml@v1.38.1
    with:
      billing-pause-bypass: ${{ github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true }}
      runner: ubuntu-slim
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v1.38.1
      git-workflow: direct
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      # Required by the reusable legacy workflow's declared npm job, which is disabled here.
      id-token: write
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
