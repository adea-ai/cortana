version: 1
profile: application
languages: rust,python,typescript
features: all
codeql: auto
dependency_review: auto
package_manager: bun
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.33.1
rust_sccache: true
rust_nextest: true
# These lanes exercise nearly every code path (installer, release-packaging,
# sidecar, browser, and budget boundaries), so they stay affected by almost
# any source change; docs-only or metadata-only diffs are the cases these
# filters skip. `.github/**` is deliberately included: workflow changes can
# alter what the lanes run.
filter_integration: '.github/**,src/**,crates/**,tests/**,scripts/**,skills/**,apps/**,eval/**,pyproject.toml,uv.lock,Cargo.toml,Cargo.lock,bun.lock,package.json,release-please-config.json,.release-please-manifest.json'
filter_e2e: '.github/**,src/**,crates/**,tests/**,scripts/**,skills/**,apps/**,eval/**,pyproject.toml,uv.lock,Cargo.toml,Cargo.lock,bun.lock,package.json'
filter_performance: '.github/**,src/**,crates/**,tests/**,scripts/**,skills/**,apps/**,eval/**,pyproject.toml,uv.lock,Cargo.toml,Cargo.lock,bun.lock,package.json,performance-package-budgets.json'
runner: ubuntu-latest
unit_runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
toolchain: auto
security_runner: ubuntu-slim
codeql_runner: ubuntu-latest
pr_runner: ubuntu-slim
release_runner: ubuntu-slim
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: rust
npm_publish: false
license: apache-2.0
git_workflow: direct
merge_strategy: squash
post_release: false
post_release_workflow:
post_release_mode: auto
sync_mode: overlay
custom_workflows: preserve
# Shard Rust CodeQL by source root: src, crates, tests, the Tauri crate, and the
# vendored glib build cover every tracked .rs file, so no whole-workspace
# "all" pass is needed. Removing the "all" shard orphans its code-scanning
# category; after this lands, retire the stale category's analyses on main
# (repo Settings > Code security > CodeQL tools, or the code-scanning API)
# so the merge gate stops waiting on a category that no longer reports.
codeql_rust_shards: '["src","crates","tests","apps/desktop/src-tauri","third_party/glib-0.18.5"]'
codeql_rust_threads: 4
codeql_rust_max_parallel: 4
release_merge_strategy: squash
opencode_security_model:
performance_runner: ubuntu-latest
performance: auto
performance_command:
performance_profile:
performance_budget_file: performance-package-budgets.json
draft_protection: true
required_capabilities:
coverage_enforcement: auto
coverage_metrics: lines
coverage_report:
