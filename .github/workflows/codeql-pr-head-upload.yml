name: CodeQL PR head upload

# GitHub's pull_request merge ref is mutable: every mergeability evaluation
# creates a fresh test merge, so analyses uploaded for the ref at run start can
# be orphaned before the merge gate re-checks them. The ruleset accepts an
# analysis of the PR head SHA instead, which is stable. This push-scoped caller
# runs the shared CodeQL matrix against the branch tip so head-SHA analyses
# exist for merges gated on code scanning results.
on:
  push:
    branches: [perf/solid-architecture-audit]

permissions: {}

concurrency:
  group: codeql-pr-head-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (PR head)
    if: vars.CI_BILLING_PAUSED != 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@v1.28.14
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v1.28.14
      runner: ubuntu-latest
      rust-shards: '["src","tests","apps/desktop/src-tauri","third_party/glib-0.18.5"]'
      rust-threads: '4'
      rust-max-parallel: 4
