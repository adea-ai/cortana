<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>User menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--background: oklch(0.1756 0.0063 300.91); --foreground: oklch(0.942 0.0054 297.72); --card: oklch(0.2106 0.0076 300.91); --popover: oklch(0.2406 0.0088 300.91); --muted-foreground: oklch(0.6967 0.0057 298.74); --border: oklch(0.3256 0.0057 300.91); position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 1.55;">
  <dc-import name="KnowledgeEmpty" hint-size="1440px,900px"></dc-import>

  <!-- AccountMenu (placement right-end, gutter 4) from the "User settings" rail button (8,856 39x36) -->
  <div role="menu" aria-label="User settings" style="position: absolute; left: 51px; top: 714px; width: 224px; box-sizing: border-box; padding: 4px; border: 1px solid var(--border); border-radius: 14px; background: var(--popover); box-shadow: 0 12px 28px oklch(0 0 0 / 0.35);">
    <div role="group">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
        <a role="menuitem" href="{{i.href}}" style="height: 33.7px; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; display: flex; align-items: center; gap: 8px; color: var(--foreground); text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;">
            <sc-if value="{{i.isIndex}}" hint-placeholder-val="{{ false }}"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></sc-if>
            <sc-if value="{{i.isInfo}}" hint-placeholder-val="{{ false }}"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></sc-if>
            <sc-if value="{{i.isHelp}}" hint-placeholder-val="{{ false }}"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></sc-if>
            <sc-if value="{{i.isFeedback}}" hint-placeholder-val="{{ false }}"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"></path><path d="M8 6v8"></path></sc-if>
            <sc-if value="{{i.isSettings}}" hint-placeholder-val="{{ false }}"><path d="M14 17H5"></path><path d="M19 7h-9"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></sc-if>
          </svg>
          <span>{{i.label}}</span>
          <sc-if value="{{i.hasKbd}}" hint-placeholder-val="{{ false }}"><span style="margin-left: auto; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; letter-spacing: 1.2px; color: var(--muted-foreground);">{{i.kbd}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { label: 'Index', href: 'Index.dc.html', isIndex: true, hasKbd: false, kbd: '' },
        { label: 'About', href: 'About.dc.html', isInfo: true, hasKbd: false, kbd: '' },
        { label: 'Help Center', href: 'HelpCenter.dc.html', isHelp: true, hasKbd: false, kbd: '' },
        { label: 'Send Feedback', href: 'https://github.com/adea-ai/cortana/issues/new?template=feedback.yml', isFeedback: true, hasKbd: false, kbd: '' },
        { label: 'Settings', href: 'SetServices.dc.html', isSettings: true, hasKbd: true, kbd: 'Ctrl,' }
      ]
    };
  }
}
</script>
</body>
</html>
