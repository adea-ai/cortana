[workspace]
members = ["crates/*"]
# Without this, cargo commands at the root build only the root package and the
# member crates' unit tests would silently never run.
default-members = [".", "crates/core", "crates/retrieval", "crates/server", "crates/mcp"]
exclude = ["apps/desktop/src-tauri", "third_party/glib-0.18.5"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/adea-ai/cortana"

[workspace.dependencies]
# Workspace member crates.
cortana-core = { path = "crates/core" }
cortana-retrieval = { path = "crates/retrieval" }
cortana-server = { path = "crates/server" }
cortana-mcp = { path = "crates/mcp" }

anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "7.0"
chacha20poly1305 = "0.11"
ed25519-dalek = "3.0"
getrandom = "0.4"
hkdf = "0.13"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
zeroize = "1.8"
fs2 = "0.4"
futures-util = "0.3"
ignore = "0.4"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.0", features = ["client", "macros", "server", "transport-io"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.21"
tokio = { version = "1.47", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
libc = "0.2"

[package]
name = "cortana"
version = "0.58.7"
edition.workspace = true
rust-version.workspace = true
description = "Local-first, agent-native second brain with configurable ingestion and hybrid retrieval"
license.workspace = true
repository.workspace = true

[dependencies]
cortana-core.workspace = true
cortana-retrieval.workspace = true
cortana-server.workspace = true
cortana-mcp.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
fs2.workspace = true
futures-util.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
fs2.workspace = true
predicates = "3.1"
rmcp.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dev builds keep application code fully debuggable while compiling
# dependencies optimized: tests, the eval latency gates, and host-launch
# runs exercise dependency-heavy paths (HTTP, SQLite, crypto) where
# unoptimized dependency code skewed wall-clock budgets.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
