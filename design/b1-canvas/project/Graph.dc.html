<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph::placeholder{color: var(--muted-foreground); opacity: 1;}
</style>
</helmet>
<div style="--background: oklch(0.1756 0.0063 300.91); --foreground: oklch(0.942 0.0054 297.72); --card: oklch(0.2106 0.0076 300.91); --muted-foreground: oklch(0.6967 0.0057 298.74); --border: oklch(0.3256 0.0057 300.91); --primary: oklch(0.7323 0.1668 301.69); width: 1440px; height: 900px; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 1.55; text-rendering: optimizeLegibility; overflow: hidden;">
  <dc-import name="Header" location="Graph" workspace="Work" hint-size="1440px,48px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex;">
    <dc-import name="Rail" active="graph" height="852" hint-size="56px,852px"></dc-import>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <main id="main-content" style="position: relative; flex-grow: 1; min-height: 0; overflow: hidden; background-color: var(--background); background-image: radial-gradient(oklch(0.3256 0.0057 300.91 / 0.72) 1px, transparent 1px); background-size: 22px 22px;">
        <h1 style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Graph</h1>
        <svg width="1384" height="824" viewBox="0 0 100 100" style="position: absolute; inset: 0;" aria-hidden="true">
          <sc-for list="{{links}}" as="l" hint-placeholder-count="8">
            <line x1="50" y1="50" x2="{{l.x}}" y2="{{l.y}}" stroke="oklch(0.7323 0.1668 301.69 / 0.45)" stroke-width="0.7" stroke-linecap="round"></line>
          </sc-for>
        </svg>

        <div style="position: absolute; left: 662px; top: 382px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: var(--background); display: flex; align-items: center; justify-content: center;">
          <img src="/_blob/a12ad60e44575d56970c6b8a31e281b4" alt="" width="24" height="24" style="width: 24px; height: 24px;">
        </div>

        <sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
          <sc-if value="{{n.isSource}}" hint-placeholder-val="{{ true }}">
            <a href="KnowledgeEmpty.dc.html" aria-label="Focus source: {{n.label}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 160px; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--foreground); font-size: 14px; font-weight: 500; line-height: 21.7px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; text-decoration: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg>
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{n.label}}</span>
            </a>
          </sc-if>
          <sc-if value="{{n.isDoc}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="{{n.pressed}}" aria-label="Open document: {{n.label}}" onClick="{{n.pick}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 160px; height: 36px; box-sizing: border-box; padding: 0 14px; border: {{n.bw}} solid {{n.bc}}; border-radius: 8px; background: {{n.bg}}; color: {{n.fg}}; font: inherit; font-size: 14px; font-weight: 500; line-height: 21.7px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{n.label}}</span>
            </button>
          </sc-if>
          <sc-if value="{{n.isWorkspace}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="false" aria-label="Focus workspace: {{n.label}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 160px; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 14px; font-weight: 500; line-height: 21.7px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"></path><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"></path><path d="M3 5a2 2 0 0 0 2 2h3"></path><path d="M3 3v13a2 2 0 0 0 2 2h3"></path></svg>
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{n.label}}</span>
            </button>
          </sc-if>
        </sc-for>

        <div style="position: absolute; left: 18px; top: 18px; width: 720px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;">
          <div role="search" style="width: 720px; box-sizing: border-box; padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / 0.2); display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
            <label style="width: 298px; height: 28px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; gap: 6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
              <input class="ph" type="search" placeholder="Filter nodes…" aria-label="Filter graph nodes" style="flex-grow: 1; min-width: 0; height: 26px; box-sizing: border-box; padding: 0; border: 0; outline: none; background: transparent; color: var(--foreground); font: inherit; font-size: 12px; line-height: 18px;">
            </label>
            <sc-for list="{{selects}}" as="s" hint-placeholder-count="3">
              <button type="button" aria-label="{{s.aria}}" style="position: relative; width: {{s.w}}px; height: 28px; box-sizing: border-box; padding: 0 32px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 12px; font-weight: 400; line-height: 18px; text-align: left; white-space: pre; cursor: pointer;">{{s.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 7px; top: 6px;"><path d="m6 9 6 6 6-6"></path></svg></button>
            </sc-for>
          </div>
          <div role="group" aria-label="Filter graph node types" style="max-width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
              <button type="button" aria-pressed="{{c.pressed}}" style="height: 24px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: {{c.bg}}; color: var(--foreground); font: inherit; font-size: 12px; font-weight: 500; line-height: 18px; cursor: pointer;">{{c.label}}</button>
            </sc-for>
          </div>
          <div role="status"><span>Showing 9 of 9 nodes · 8 links</span></div>
        </div>
        <sc-if value="{{selected}}" hint-placeholder-val="{{ false }}">
          <div role="complementary" aria-label="Selected graph node" style="position: absolute; left: 1116px; top: 18px; width: 250px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / 0.2); display: flex; flex-direction: column; overflow: hidden;">
            <header style="box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 12px;">
              <div style="min-width: 0; flex-grow: 1;">
                <p style="margin: 0; color: var(--muted-foreground); font-size: 11px; font-weight: 600; line-height: 15.95px; letter-spacing: 0.275px; text-transform: uppercase;">Document</p>
                <h2 style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; line-height: 21.7px;">How do releases work?</h2>
              </div>
            </header>
            <div style="box-sizing: border-box; padding: 12px 16px; display: flex; flex-direction: column; gap: 16px;">
              <div style="display: grid; gap: 8px;">
                <h3 style="margin: 0; color: var(--muted-foreground); font-size: 11px; font-weight: 600; line-height: 15.95px; letter-spacing: 0.275px; text-transform: uppercase;">Node</h3>
                <dl style="margin: 0; display: grid; gap: 8px;">
                  <div style="display: flex; justify-content: space-between; gap: 16px;"><dt style="color: var(--muted-foreground);">Workspace</dt><dd style="margin: 0; text-align: right;">work</dd></div>
                  <div style="display: flex; justify-content: space-between; gap: 16px;"><dt style="color: var(--muted-foreground);">Source</dt><dd style="margin: 0; text-align: right;">work-drive</dd></div>
                  <div style="display: flex; justify-content: space-between; gap: 16px;"><dt style="color: var(--muted-foreground);">Related links</dt><dd style="margin: 0; text-align: right;">1</dd></div>
                </dl>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <h3 style="margin: 0; color: var(--muted-foreground); font-size: 11px; font-weight: 500; line-height: 15.95px; letter-spacing: 0.275px; text-transform: uppercase;">Relationships</h3>
                <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
                  <li style="display: flex; flex-direction: column; gap: 2px;">
                    <span style="font-weight: 500;">Contained by its workspace or source</span>
                    <span style="color: var(--muted-foreground); font-size: 12px; line-height: 18px;">Explicit relationship · 1 supporting record · citation-capable</span>
                  </li>
                </ul>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <button type="button" style="height: 28px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 12px; font-weight: 500; line-height: 18px; cursor: pointer;">Pin node</button>
                <a href="KnowledgeDocument.dc.html" style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: var(--card); color: var(--foreground); font-size: 12px; font-weight: 500; line-height: 18px; display: flex; align-items: center; text-decoration: none;">Open document</a>
                <button type="button" style="height: 28px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; font-size: 12px; font-weight: 500; line-height: 18px; cursor: pointer;">Expand one-hop relationships</button>
              </div>
            </div>
          </div>
        </sc-if>
      </main>
      <dc-import name="StatusBar" hint-size="1384px,28px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Mirrors KnowledgeGraphView: nodes on an orbit of radius clamp(110px, 20vw, 300px) = 288px at 1440,
    // link endpoints at 50 + 31*cos/sin(angle) in a 0..100 viewBox (meet-scaled into 1384x824).
    const raw = [
      { label: 'work', kind: 'ws', linked: false },
      { label: 'work-drive', kind: 'src', linked: true },
      { label: 'How do releases work?', kind: 'doc', linked: true },
      { label: 'work-code', kind: 'src', linked: true },
      { label: 'Deployment playbook', kind: 'doc', linked: true },
      { label: 'team-slack', kind: 'src', linked: true },
      { label: 'Slack: #releases — cadence', kind: 'doc', linked: true },
      { label: 'personal-notes', kind: 'src', linked: true },
      { label: 'Incident response playbook', kind: 'doc', linked: true }
    ];
    const sel = (this.state && this.state.selected) || (this.props.selected === true || this.props.selected === 'true' ? 'How do releases work?' : null);
    const cx = 692, cy = 412, r = 288, count = raw.length;
    const nodes = raw.map((n, i) => {
      const a = (i / count) * Math.PI * 2;
      return {
        ...n,
        left: Math.round((cx + r * Math.cos(a) - 80) * 10000) / 10000,
        top: Math.round((cy + r * Math.sin(a) - 18) * 10000) / 10000,
        isSource: n.kind === 'src', isDoc: n.kind === 'doc', isWorkspace: n.kind === 'ws',
        // Selected document node (app: ActionButton default variant, no border).
        pressed: sel === n.label ? 'true' : 'false',
        bg: sel === n.label ? 'var(--primary)' : 'transparent',
        fg: sel === n.label ? 'var(--background)' : 'var(--foreground)',
        bc: sel === n.label ? 'var(--primary)' : 'var(--border)',
        bw: sel === n.label ? '0px' : '1px',
        pick: n.label === 'How do releases work?' ? () => this.setState({ selected: this.state.selected ? null : n.label }) : null
      };
    });
    const links = raw.map((n, i) => ({ n, i })).filter((x) => x.n.linked).map(({ i }) => {
      const a = (i / count) * Math.PI * 2;
      return { x: 50 + 31 * Math.cos(a), y: 50 + 31 * Math.sin(a) };
    });
    return {
      nodes, links, selected: !!sel,
      selects: [
        { label: 'All relationships', w: 136, aria: 'Filter graph relationships' },
        { label: 'All origins', w: 100, aria: 'Filter graph relationship origin' },
        { label: 'Any confidence', w: 136, aria: 'Filter graph minimum confidence' }
      ],
      chips: ['All', 'Workspaces', 'Sources', 'Documents'].map((label, i) => ({
        label, pressed: i === 0 ? 'true' : 'false',
        bg: i === 0 ? 'oklch(0.7323 0.1668 301.69 / 0.16)' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
