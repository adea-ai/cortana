name: Dev build

# The dev update channel's build lane. Installs that opt into "Dev" follow
# main: every push publishes a fully-built, fully-signed desktop update whose
# version is `<desktop app version on main>-dev.<run number>`. It is a
# pre-release visible only to the dev channel and cannot be promoted to stable
# (the promoter's batch selector matches only the plain tag shape).
#
# Creating the release alone is not enough: the source commit carries the
# desktop/core version the build will report, while the updater manifest and
# artifact names must carry the dev version. So this lane creates the
# release and then dispatches release-assets.yml with `version_override`,
# which patches the version into the build inputs on a throwaway checkout —
# and the release:published event path skips dev-shaped tags, so nothing
# builds the unpatched version by accident. Concurrency cancels superseded
# pushes: after a burst of merges the newest commit is the one that ships.
# This lane gates nothing; a red run here never blocks a merge.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  cut-dev-release:
    name: Cut the dev pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release pipeline owns `chore(main): release …` commits; those builds
    # are the daily pre-releases, not dev builds.
    if: >-
      ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    steps:
      - name: Check out the source version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Publish the dev pre-release and start the build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # Match the exact source commit whose core binary the release lane
          # builds. The latest stable can lag a version bump and produce a tag
          # older than the binary itself.
          base="$(
            jq -er '
              .version
              | strings
              | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              | select(. != "0.0.0")
            ' apps/desktop/src-tauri/tauri.conf.json
          )" || {
            echo "The checked-out desktop source has no stable SemVer version." >&2
            exit 1
          }
          version="${base}-dev.${RUN_NUMBER}"
          tag="v${version}"
          echo "Dev version: ${version} (anchored at desktop source ${base})"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists; retrying asset publication."
          else
            notes="$(printf 'Dev build of main @ %s.\n\nInstalls on the dev update channel only; never promoted to stable.' "$SHA")"
            gh release create "$tag" --repo "$repo" \
              --prerelease --target "$SHA" \
              --title "Cortana $tag" --notes "$notes"
          fi

          if ! gh release view "$tag" --repo "$repo" --json isPrerelease --jq '.isPrerelease' | grep -qx true; then
            echo "Release $tag is not a dev prerelease; refusing to dispatch release assets." >&2
            exit 1
          fi

          # The release event path skips dev-shaped tags by design; dispatch
          # the build with the version the artifacts must carry. This also
          # makes rerunning the same workflow run repair an incomplete release.
          gh workflow run release-assets.yml --repo "$repo" --ref main \
            -f tag="$tag" -f version_override="$version"

      - name: Prune old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Keep the newest ten dev builds; the API returns newest first.
          gh api "repos/$repo/releases?per_page=100" --jq '
            .[]
            | select(.prerelease == true)
            | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
            | .tag_name
          ' | tail -n +11 | while read -r old; do
            echo "Pruning old dev release $old"
            gh release delete "$old" --repo "$repo" --yes --cleanup-tag
          done
