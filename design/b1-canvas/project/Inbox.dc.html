<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="--background: oklch(0.1756 0.0063 300.91); --foreground: oklch(0.942 0.0054 297.72); --card: oklch(0.2106 0.0076 300.91); --muted-foreground: oklch(0.6967 0.0057 298.74); --border: oklch(0.3256 0.0057 300.91); --primary: oklch(0.7323 0.1668 301.69); --destructive: oklch(0.7345 0.1626 25.78); width: 1440px; height: 900px; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font-family: 'Space Grotesk', sans-serif; font-size: 14px; line-height: 1.55; overflow: hidden;">
  <dc-import name="Header" location="Inbox" workspace="Work" hint-size="1440px,48px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex;">
    <dc-import name="Rail" active="inbox" height="852" hint-size="56px,852px"></dc-import>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <main id="main-content" style="flex-grow: 1; min-height: 0; overflow: hidden; background: var(--background); display: flex; flex-direction: column;">
        <header style="flex-shrink: 0; padding: 20px 20px 16px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px;">
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="display: block; font-size: 11px; font-weight: 500; line-height: 15.95px; letter-spacing: 0.275px; text-transform: uppercase; color: var(--muted-foreground);">Attention</span>
            <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 27px; letter-spacing: -0.5px;">Inbox</h1>
            <p style="margin: 0; color: var(--muted-foreground); line-height: 21.7px;">Current sync health and source-job activity. Nothing here is fabricated history.</p>
          </div>
        </header>
        <div role="separator" style="flex-shrink: 0; height: 1px; background: var(--border);"></div>
        <div style="box-sizing: border-box; padding: 20px 20px 56px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 28px;">
          <div style="display: flex; flex-direction: column; gap: 24px;">
            <section aria-labelledby="m7-sync-attention" style="display: flex; flex-direction: column; gap: 12px;">
              <h2 id="m7-sync-attention" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 25.2px; letter-spacing: -0.45px;">Sync attention</h2>
              <div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px;">
                <div style="box-sizing: border-box; padding: 16px 0; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / 0.2); display: flex; flex-direction: column; gap: 16px;">
                  <div style="padding: 0 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
                    <div style="min-width: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
                      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; line-height: 16px; letter-spacing: -0.4px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                        <span>community-discord</span>
                      </div>
                      <div style="color: var(--muted-foreground);">community · started 7/29/2026, 1:50:00 PM</div>
                    </div>
                    <span style="padding-top: 2px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap;"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 9999px; background: var(--destructive);"></span><span>Budget exceeded</span></span>
                  </div>
                  <div style="padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                    <p style="margin: 0; min-width: 0; flex-grow: 1; color: var(--muted-foreground);">1m / 15m</p>
                    <p style="margin: 0; font-size: 12px; line-height: 18px; color: var(--muted-foreground); text-align: right; white-space: nowrap;">0 documents · 0 bytes</p>
                  </div>
                </div>
              </div>
            </section>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <a href="SetSources.dc.html" style="height: 28px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 8px; background: var(--card); color: var(--foreground); font-size: 12px; font-weight: 500; line-height: 18px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>
              Manage ingestion in settings
            </a>
          </div>
        </div>
      </main>
      <dc-import name="StatusBar" hint-size="1384px,28px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
