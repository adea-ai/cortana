version: 1
profile: application
languages: rust,python,typescript
features: all
codeql: auto
dependency_review: auto
package_manager: bun
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.28.14
runner: ubuntu-latest
unit_runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
toolchain: auto
security_runner: ubuntu-slim
codeql_runner: ubuntu-latest
pr_runner: ubuntu-slim
release_runner: ubuntu-slim
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: rust
npm_publish: false
license: apache-2.0
git_workflow: direct
merge_strategy: squash
post_release: false
post_release_workflow:
post_release_mode: auto
sync_mode: overlay
custom_workflows: preserve
# Report the complete workspace scan (matching the default-branch lane for
# differential parity) alongside the three manifest shards. GitHub code
# scanning tracks every analysis category it has seen and blocks the merge
# gate until each tracked category reports, so dropping a shard orphans its
# category and stalls the gate as "configurations not found".
codeql_rust_shards: '["all","src","apps/desktop/src-tauri","third_party/glib-0.18.5"]'
codeql_rust_threads: 2
codeql_rust_max_parallel: 3
release_merge_strategy: squash
opencode_security_model:
performance_runner: ubuntu-latest
performance: auto
performance_command:
performance_profile:
performance_budget_file: performance-package-budgets.json
draft_protection: true
required_capabilities:
coverage_enforcement: auto
coverage_metrics: lines
coverage_report:
