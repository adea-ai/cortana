    const cycle = ['work-drive', 'work-code', 'team-slack', 'personal-notes'];
    const rows = large
      ? Array.from({ length: 50 }, (_, i) => ['Large corpus document ' + String(i + 1).padStart(4, '0'), cycle[i % 4]])
      : (is('status-failed', 'status-stale', 'default') ? names : []);
    const docs = rows.map(([title, source], i) => ({
      title, source,
      current: i === selected ? 'true' : 'false',
      bg: i === selected ? 'oklch(0.7323 0.1668 301.69 / 0.16)' : 'transparent',
      sourceColor: i === selected ? 'oklch(0.942 0.0054 297.72)' : 'oklch(0.6967 0.0057 298.74)'
    }));
    const statusText = state === 'status-failed' ? 'Status request failed (502)' : 'Status request failed (502) Showing the last known source index.';
    return {
      workspace,
      sheet,
      docked: !sheet,
      regionRole: sheet ? 'none' : 'region',
      regionLabel: sheet ? 'Sources' : 'Sources and documents',
      closeHref: this.props.closeHref ?? 'KnowledgeEmpty.dc.html',
      width: Number(this.props.width ?? 270),
      height: Number(this.props.height ?? 824),
      sources: workspace === 'Personal' ? personal : work,
      docs,
      modeLabel: state === 'status-failed' ? 'Ingestion status unavailable' : state === 'loading' ? 'Ingestion loading status…' : 'Ingestion paused · manual only',
      modeDot: is('status-failed', 'status-stale') ? warn : grey,
      statusAlerts: is('status-failed', 'status-stale') ? [{ text: statusText }] : [],
      showSkeleton: state === 'loading',
      showEmpty: state === 'empty',
      showTree: !is('status-failed', 'loading', 'empty'),
      crumbRoot: is('status-failed', 'loading') ? 'Documents' : workspace,
      loaded: large ? 50 : (is('default', 'status-failed', 'status-stale') ? docs.length : 0),
      docsFailed: state === 'docs-failed',
      docNote: state === 'empty' ? 'No documents match this scope.' : state === 'loading' ? 'Loading documents…' : '',
      hasDocs: docs.length > 0,
      loadingMore: state === 'loading-more',
      loadMore: state === 'load-more'
    };
  }
}
</script>
</body>
</html>
