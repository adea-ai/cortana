name: Promote stable

# The stable gate of the three update channels. Daily releases publish as
# pre-releases (release.yml's mark-prerelease) so only the pre-release channel
# offers them; this lane promotes a batch to stable once it has soaked.
#
# Batch-soak rule: find everything published after the last stable release
# (the candidate batch); when the OLDEST member has been public for SOAK_HOURS,
# promote the NEWEST member (the tip, which carries every mid-soak hotfix) and
# leave the intermediates skipped forever — releases are cumulative, so stable
# users miss nothing. Continuous daily releases therefore promote roughly every
# soak period; quiet weeks promote less, automatically.
#
# Nothing here rebuilds or re-signs: promotion is a visibility flag flip, and
# GitHub's `releases/latest` feed (the stable channel) resolves to the newest
# non-prerelease release the moment it flips.

on:
  schedule:
    # Daily, shortly after the release window settles (12:00 UTC). With a 96h
    # soak a daily cadence simply re-checks the clock; the soak, not the cron,
    # decides when a batch is ready.
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Promote this specific version now (for example 0.75.1). Leave empty to follow the soak rule.
        required: false
        type: string
      force:
        description: Promote the newest pre-release regardless of the soak.
        required: false
        type: boolean
        default: false
      hold:
        description: Set (true) or clear (false) the promotion hold; nothing promotes on schedule while held.
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Apply the promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate the batch and promote the tip
        env:
          GH_TOKEN: ${{ github.token }}
          SOAK_HOURS: '96'
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          HOLD: ${{ inputs.hold }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          summary="$GITHUB_STEP_SUMMARY"

          # The hold switch is a repository variable so a bad batch can be
          # halted without a code change; a dispatch sets or clears it.
          if [ "$HOLD" = "true" ] || [ "$HOLD" = "false" ]; then
            wanted="false"; [ "$HOLD" = "true" ] && wanted="true"
            if gh api "repos/$repo/actions/variables/STABLE_PROMOTION_HELD" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$repo/actions/variables/STABLE_PROMOTION_HELD" -f value="$wanted" >/dev/null
            else
              gh api -X POST "repos/$repo/actions/variables" -f name=STABLE_PROMOTION_HELD -f value="$wanted" >/dev/null
            fi
            echo "Promotion hold set to $wanted." | tee -a "$summary"
          fi

          # A manually named version wins over everything but the hold.
          if [ -n "$VERSION" ]; then
            if [ "$(gh api "repos/$repo/actions/variables/STABLE_PROMOTION_HELD" --jq '.value' 2>/dev/null || echo false)" = "true" ] && [ "$FORCE" != "true" ]; then
              echo "Promotion is held; pass force=true to promote $VERSION anyway." | tee -a "$summary"
              exit 0
            fi
            gh release edit "v$VERSION" --repo "$repo" --prerelease=false --latest
            echo "Promoted v$VERSION to stable by name." | tee -a "$summary"
            exit 0
          fi

          releases="$(mktemp)"
          gh api "repos/$repo/releases?per_page=100" > "$releases"

          # The last promoted stable anchors the candidate batch.
          last_stable_published="$(jq -r '
            [ .[] | select(.draft == false and .prerelease == false) ][0].published_at // "null"
          ' "$releases")"
          echo "Last stable published: $last_stable_published"

          # The batch: every non-draft pre-release published since then, with
          # the plain release tag shape (dev builds carry a -dev suffix and
          # live on their own channel forever; they are never promoted).
          batch="$(jq -r '
            [ .[]
              | select(.draft == false and .prerelease == true)
              | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select("$last_stable_published" == "null" or .published_at > "$last_stable_published")
              | { tag: .tag_name, published_at: .published_at, body: .body } ]
            | sort_by(.published_at)
          ' "$releases")"

          oldest="$(jq -r '.[0].published_at // "empty"' <<<"$batch")"
          if [ "$oldest" = "empty" ]; then
            echo "No pre-release batch is waiting; nothing to promote." | tee -a "$summary"
            exit 0
          fi

          oldest_epoch="$(date -d "$oldest" +%s)"
          now_epoch="$(date -u +%s)"
          age_hours=$(( (now_epoch - oldest_epoch) / 3600 ))
          tip="$(jq -r '.[-1].tag' <<<"$batch")"

          if [ "$age_hours" -lt "$SOAK_HOURS" ] && [ "$FORCE" != "true" ]; then
            echo "The batch has soaked ${age_hours}h of ${SOAK_HOURS}h; holding. Tip: $tip" | tee -a "$summary"
            exit 0
          fi

          # Stitch the batch's notes oldest→newest so the stable release
          # documents everything stable users are getting, not just the tip.
          jq -r '.[] | "## " + .tag + "\n\n" + (.body // "")' <<<"$batch" > batch-notes.md
          gh release edit "$tip" --repo "$repo" --prerelease=false --latest --notes-file batch-notes.md
          count="$(jq 'length' <<<"$batch")"
          echo "Promoted $tip to stable: the batch of $count had soaked ${age_hours}h." | tee -a "$summary"
